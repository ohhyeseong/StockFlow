# File preparation only. Starting this service requires separate approval.
# After approval, use --env-file .env.test.local and --profile integration.
# The database is disposable; stopping/removing the container loses its data.
name: stockflow-test
services:
  mysql-test:
    image: mysql:8.0
    profiles: [integration]
    ports:
      - '127.0.0.1:3308:3306'
    environment:
      MYSQL_DATABASE: stockflow_test
      MYSQL_USER: stockflow_test
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env.test.local}
      MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:?Set TEST_DB_ROOT_PASSWORD in .env.test.local}
    command:
      - --default-time-zone=+00:00
      - --default-storage-engine=InnoDB
    tmpfs:
      - /var/lib/mysql
    restart: 'no'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '--host=127.0.0.1', '--silent']
      interval: 5s
      timeout: 3s
      retries: 20
